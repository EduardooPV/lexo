name: Build Lexo

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "CLAUDE.md"
  workflow_dispatch:

# Serialize release runs so two pushes can't race to the same version.
concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  # Computes the next patch version once so every platform in the build matrix
  # releases under the identical tag. The bump is only written to the repo by
  # the `finalize` job, and only after every platform has built successfully —
  # a single platform failing must not leave main on a version nothing shipped.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute next patch version
        id: compute
        run: |
          version=$(node -p "require('./package.json').version")
          IFS='.' read -r major minor patch <<< "$version"
          new="$major.$minor.$((patch + 1))"
          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "tag=v$new" >> "$GITHUB_OUTPUT"
          echo "New version: v$new"

  build:
    needs: version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # Tauri v2's own prerequisites for building on Ubuntu: webkit2gtk for the
      # webview, libxdo for enigo's simulated keystrokes (selection translate /
      # replace), libssl for reqwest, ayatana + librsvg for the tray icon.
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm install

      # Bakes the version computed by the `version` job into this runner's own
      # checkout so the built installer's version metadata matches the release
      # tag. Not committed here — each matrix job's checkout is thrown away;
      # `finalize` persists the bump once, after every platform has succeeded.
      - name: Apply release version
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const version = '${{ needs.version.outputs.version }}';
            for (const file of ['package.json', 'src-tauri/tauri.conf.json']) {
              const json = JSON.parse(fs.readFileSync(file, 'utf8'));
              json.version = version;
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
            }
            const cargoPath = 'src-tauri/Cargo.toml';
            const cargo = fs.readFileSync(cargoPath, 'utf8');
            fs.writeFileSync(
              cargoPath,
              cargo.replace(/^version = \"\d+\.\d+\.\d+\"/m, 'version = \"' + version + '\"')
            );
          "

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: "Lexo ${{ needs.version.outputs.version }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lexo-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore

  # Persists the version bump to main, but only once every platform above has
  # actually built and released successfully.
  finalize:
    name: Commit version bump
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply the released version
        run: |
          node -e "
            const fs = require('fs');
            const version = '${{ needs.version.outputs.version }}';
            for (const file of ['package.json', 'src-tauri/tauri.conf.json']) {
              const json = JSON.parse(fs.readFileSync(file, 'utf8'));
              json.version = version;
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
            }
            const cargoPath = 'src-tauri/Cargo.toml';
            const cargo = fs.readFileSync(cargoPath, 'utf8');
            fs.writeFileSync(
              cargoPath,
              cargo.replace(/^version = \"\d+\.\d+\.\d+\"/m, 'version = \"' + version + '\"')
            );
          "
          # Regenerates Cargo.lock's own recorded version for the `tradutor`
          # package to match — cheap, and keeps the lockfile from drifting.
          cargo check --quiet --manifest-path src-tauri/Cargo.toml

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore(release): ${{ needs.version.outputs.tag }} [skip ci]"
          git push origin HEAD:main
