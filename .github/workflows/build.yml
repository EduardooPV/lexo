name: Build Translator

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "CLAUDE.md"
  workflow_dispatch:

# Serialize release builds so two pushes can't race to the same version.
concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version
        id: version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $p = $pkg.version.Split('.')
          $new = "$($p[0]).$($p[1]).$([int]$p[2] + 1)"
          $rx = '("version"\s*:\s*")\d+\.\d+\.\d+(")'
          (Get-Content package.json -Raw)              -replace $rx, "`${1}$new`${2}" | Set-Content package.json -Encoding utf8 -NoNewline
          (Get-Content src-tauri/tauri.conf.json -Raw) -replace $rx, "`${1}$new`${2}" | Set-Content src-tauri/tauri.conf.json -Encoding utf8 -NoNewline
          (Get-Content src-tauri/Cargo.toml -Raw)      -replace '(?m)^version = "\d+\.\d+\.\d+"', "version = ""$new""" | Set-Content src-tauri/Cargo.toml -Encoding utf8 -NoNewline
          "version=$new" >> $env:GITHUB_OUTPUT
          "tag=v$new"    >> $env:GITHUB_OUTPUT
          Write-Host "New version: v$new"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: "Translator ${{ steps.version.outputs.version }}"
          releaseDraft: false
          prerelease: false

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: translator-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      # Persist the bumped version back to main. This push uses the default
      # GITHUB_TOKEN, whose pushes do NOT re-trigger `on: push`, so no loop.
      - name: Commit version bump
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore(release): ${{ steps.version.outputs.tag }} [skip ci]"
          git push origin HEAD:main
