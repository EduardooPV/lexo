[package]
name = "tradutor"
version = "0.1.4"
description = "Tradutor PT ⇄ EN com atalho global"
authors = ["EduardooPV"]
edition = "2021"

[lib]
name = "tradutor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Uses the platform-native TLS (schannel on Windows), so it trusts the
# certificates installed by the OS — important on corporate networks that
# intercept HTTPS with their own root CA.
reqwest = { version = "0.12", features = ["json"] }
# Simulate Ctrl+C and read the cursor position to translate the current selection
# from any app. On Windows this uses the native API (no extra system deps).
enigo = "0.3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
