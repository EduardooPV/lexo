[package]
name = "tradutor"
version = "0.1.7"
description = "Tradutor PT ⇄ EN com atalho global"
authors = ["EduardooPV"]
edition = "2021"

[lib]
name = "tradutor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Uses the platform-native TLS (schannel on Windows), so it trusts the
# certificates installed by the OS — important on corporate networks that
# intercept HTTPS with their own root CA.
reqwest = { version = "0.12", features = ["json"] }
enigo = "0.3"

# Screen-region OCR, entirely native: GDI captures the pixels and the OCR engine
# that ships with Windows reads them. No extra service, no bundled model.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
] }
windows = { version = "0.61", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
